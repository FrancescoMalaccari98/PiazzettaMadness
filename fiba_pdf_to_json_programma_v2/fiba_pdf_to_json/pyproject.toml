[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiba-pdf-to-json"
version = "0.2.0"
description = "Convertitore locale PDF tabellini FIBA Live Stats in JSON"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "opencv-python>=4.9.0",
  "pytesseract>=0.3.10",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
]

[project.scripts]
fiba-pdf-to-json = "fiba_pdf_to_json.cli:main"
