<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Tripla, Schiacciata e Stoppata</title>
  <style>
    :root {
      --orange: #ff7a00;
      --yellow: #ffd166;
      --red: #ff4d4d;
      --blue: #59a8ff;
      --cyan: #a8e7ff;
      --bg1: #050608;
      --bg2: #13151b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 30%, rgba(255,255,255,0.06), transparent 24%),
        radial-gradient(circle at 20% 80%, rgba(89,168,255,0.08), transparent 26%),
        radial-gradient(circle at 80% 20%, rgba(255,122,0,0.08), transparent 26%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, #08090c);
    }

    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      color: rgba(255,255,255,0.78);
      font-size: 14px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      text-align: center;
    }

    .stage {
      width: min(1040px, 94vw);
      padding: 30px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      background: rgba(255,255,255,0.04);
      box-shadow:
        0 28px 80px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 2;
    }

    .title {
      text-align: center;
      font-size: clamp(28px, 5vw, 54px);
      font-weight: 1000;
      letter-spacing: -0.04em;
      margin: 0 0 10px;
    }

    .sub {
      text-align: center;
      color: rgba(255,255,255,0.72);
      font-size: 16px;
      margin-bottom: 26px;
    }

    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    button {
      appearance: none;
      padding: 15px 24px;
      border: 0;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 950;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .three-btn,
    .dunk-btn {
      color: #111;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      box-shadow: 0 12px 30px rgba(255,122,0,0.25);
    }

    .block-btn {
      color: #06233b;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 12px 30px rgba(89,168,255,0.25);
    }

    .free-btn {
      color: white;
      border: 1px solid rgba(255, 209, 102, 0.42);
      background: linear-gradient(
        135deg,
        rgba(255, 209, 102, 0.18),
        rgba(255, 122, 0, 0.12)
      );
      box-shadow: 0 10px 26px rgba(255, 122, 0, 0.1);
    }

    .neutral-btn {
      color: white;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
    }

    .overlay {
      position: fixed;
      inset: 0;
      visibility: hidden;
      pointer-events: none;
      overflow: hidden;
      display: grid;
      place-items: center;
      z-index: 10;
    }

    .overlay.active {
      visibility: visible;
    }

    .card {
      position: relative;
      z-index: 4;
      width: min(920px, 92vw);
      text-align: center;
      padding: 24px;
      filter: drop-shadow(0 20px 34px rgba(0,0,0,0.55));
    }

    .big {
      opacity: 0;
      font-size: clamp(74px, 16vw, 210px);
      font-weight: 1000;
      line-height: 0.82;
      letter-spacing: -0.08em;
    }

    .label {
      opacity: 0;
      margin-top: 18px;
      font-size: clamp(52px, 10vw, 150px);
      font-weight: 1000;
      font-style: italic;
      line-height: 0.84;
      letter-spacing: -0.05em;
    }

    .tag {
      display: inline-block;
      opacity: 0;
      margin-top: 24px;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: clamp(15px, 2.2vw, 26px);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.68);
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
    }

    /* =========================
       TRIPLA
    ========================= */
    #threeOverlay .flash {
      position: absolute;
      inset: -30%;
      opacity: 0;
      background:
        radial-gradient(circle at center,
          rgba(255, 244, 170, 0.98) 0%,
          rgba(255, 166, 0, 0.78) 18%,
          rgba(255, 85, 0, 0.28) 42%,
          transparent 68%);
    }

    #threeOverlay.active .flash {
      animation: flash 1.65s ease-out forwards;
    }

    #threeOverlay .rings {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 5px solid var(--yellow);
      border-radius: 50%;
      opacity: 0;
      box-shadow:
        0 0 24px var(--orange),
        inset 0 0 24px var(--orange);
    }

    #threeOverlay.active .rings {
      animation: ring 1.3s ease-out forwards;
    }

    #threeOverlay .big {
      color: white;
      -webkit-text-stroke: 4px var(--orange);
      text-shadow:
        8px 8px 0 rgba(0,0,0,0.28),
        0 0 36px rgba(255,122,0,0.75);
    }

    #threeOverlay .label {
      color: transparent;
      background: linear-gradient(180deg, #fff 0%, #ffe08a 35%, #ff7a00 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 2px rgba(255,255,255,0.65);
      text-shadow: 0 0 34px rgba(255,122,0,0.55);
    }

    #threeOverlay.active .big {
      animation: numberIn 1.7s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    #threeOverlay.active .label {
      animation: wordIn 1.7s 80ms cubic-bezier(.16, 1, .3, 1) forwards;
    }

    #threeOverlay.active .tag {
      animation: subtitleIn 1.5s 260ms ease-out forwards;
    }

    /* =========================
       SCHIACCIATA
    ========================= */
    #dunkOverlay .flash {
      position: absolute;
      inset: -28%;
      opacity: 0;
      background:
        radial-gradient(circle at center,
          rgba(255,239,180,0.95) 0%,
          rgba(255,145,0,0.82) 20%,
          rgba(255,77,77,0.32) 44%,
          transparent 68%);
    }

    #dunkOverlay.active .flash {
      animation: dunkFlash 1.2s ease-out forwards;
    }

    #dunkOverlay .rim {
      position: absolute;
      top: 14%;
      left: 50%;
      width: 220px;
      height: 38px;
      transform: translateX(-50%);
      border: 5px solid rgba(255,255,255,0.85);
      border-radius: 50px;
      box-shadow: 0 0 20px rgba(255,255,255,0.35);
      opacity: 0;
    }

    #dunkOverlay.active .rim {
      animation: rimPop 1.25s ease-out forwards;
    }

    #dunkOverlay .ball {
      position: absolute;
      top: 8%;
      left: 50%;
      width: 86px;
      height: 86px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #ffb15c, #f06c00 64%, #b44a00 100%);
      box-shadow: 0 0 26px rgba(255,122,0,0.55);
      opacity: 0;
    }

    #dunkOverlay .ball::before,
    #dunkOverlay .ball::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid rgba(60,20,0,0.65);
    }

    #dunkOverlay .ball::before {
      clip-path: polygon(0 48%, 100% 48%, 100% 56%, 0 56%);
      border-width: 0 0 4px 0;
      border-color: transparent transparent rgba(60,20,0,0.65) transparent;
    }

    #dunkOverlay .ball::after {
      width: 44%;
      left: 28%;
      top: 0;
      bottom: 0;
      border-left: 3px solid rgba(60,20,0,0.65);
      border-right: 3px solid rgba(60,20,0,0.65);
      border-top: 0;
      border-bottom: 0;
      border-radius: 50%;
      border-color: rgba(60,20,0,0.65);
    }

    #dunkOverlay.active .ball {
      animation: ballSlam 1.15s cubic-bezier(.18,.9,.25,1) forwards;
    }

    #dunkOverlay .impact-ring {
      position: absolute;
      left: 50%;
      top: 34%;
      width: 140px;
      height: 140px;
      border: 6px solid var(--yellow);
      border-radius: 50%;
      box-shadow: 0 0 30px var(--orange), inset 0 0 18px var(--orange);
      opacity: 0;
    }

    #dunkOverlay.active .impact-ring {
      animation: impactRing 0.85s 0.38s ease-out forwards;
    }

    #dunkOverlay .crack {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(720px, 86vw);
      height: 6px;
      transform: translate(-50%, -50%);
      opacity: 0;
      background:
        linear-gradient(90deg,
          transparent 0%,
          rgba(255,255,255,0.0) 6%,
          rgba(255,240,180,0.96) 30%,
          rgba(255,122,0,1) 50%,
          rgba(255,240,180,0.96) 70%,
          rgba(255,255,255,0.0) 94%,
          transparent 100%);
      box-shadow: 0 0 18px rgba(255,122,0,0.9);
    }

    #dunkOverlay.active .crack {
      animation: crackLine 0.72s 0.4s ease-out forwards;
    }

    #dunkOverlay .big {
      color: white;
      -webkit-text-stroke: 4px var(--red);
      text-shadow:
        8px 8px 0 rgba(0,0,0,0.25),
        0 0 36px rgba(255,77,77,0.65);
    }

    #dunkOverlay .label {
      color: transparent;
      background: linear-gradient(180deg, #fff 0%, #ffe79a 36%, #ff7a00 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 2px rgba(255,255,255,0.58);
      text-shadow: 0 0 26px rgba(255,122,0,0.45);
    }

    #dunkOverlay.active .big {
      animation: dunkBig 1.55s cubic-bezier(.16,1,.3,1) forwards;
    }

    #dunkOverlay.active .label {
      animation: dunkLabel 1.55s 0.06s cubic-bezier(.16,1,.3,1) forwards;
    }

    #dunkOverlay.active .tag {
      animation: dunkTag 1.35s 0.28s ease-out forwards;
    }

    /* =========================
       STOPPATA
    ========================= */
    #blockOverlay .blue-flash {
      position: absolute;
      inset: -24%;
      opacity: 0;
      background:
        radial-gradient(circle at center,
          rgba(220,246,255,0.95) 0%,
          rgba(89,168,255,0.62) 24%,
          rgba(89,168,255,0.18) 44%,
          transparent 70%);
    }

    #blockOverlay.active .blue-flash {
      animation: blockFlash 1.35s ease-out forwards;
    }

    #blockOverlay .shield {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180px;
      height: 180px;
      border: 6px solid var(--cyan);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.2);
      opacity: 0;
      box-shadow: 0 0 28px rgba(89,168,255,0.72), inset 0 0 18px rgba(89,168,255,0.6);
    }

    #blockOverlay.active .shield {
      animation: shieldPulse 1.1s ease-out forwards;
    }

    #blockOverlay .wall {
      position: absolute;
      left: -42vw;
      top: 50%;
      width: 62vw;
      height: 20px;
      border-radius: 999px;
      transform: translateY(-50%) skewX(-22deg);
      opacity: 0;
      background: linear-gradient(90deg, rgba(168,231,255,0.0), rgba(168,231,255,0.95), rgba(89,168,255,1));
      box-shadow: 0 0 26px rgba(89,168,255,0.92);
    }

    #blockOverlay.active .wall {
      animation: wallSwipe 1.2s cubic-bezier(.16,1,.3,1) forwards;
    }

    #blockOverlay .reject-ball {
      position: absolute;
      left: 62%;
      top: 42%;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 30%, #ffb15c, #f06c00 64%, #b44a00 100%);
      box-shadow: 0 0 20px rgba(255,122,0,0.45);
      opacity: 0;
    }

    #blockOverlay.active .reject-ball {
      animation: rejectBall 1.15s cubic-bezier(.2,.82,.25,1) forwards;
    }

    #blockOverlay .big {
      color: white;
      -webkit-text-stroke: 4px var(--blue);
      text-shadow:
        8px 8px 0 rgba(0,0,0,0.25),
        0 0 34px rgba(89,168,255,0.75);
    }

    #blockOverlay .label {
      color: transparent;
      background: linear-gradient(180deg, #fff 0%, #dff5ff 36%, #59a8ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 2px rgba(255,255,255,0.65);
      text-shadow: 0 0 26px rgba(89,168,255,0.5);
    }

    #blockOverlay.active .big {
      animation: blockBig 1.55s cubic-bezier(.16,1,.3,1) forwards;
    }

    #blockOverlay.active .label {
      animation: blockLabel 1.55s 0.05s cubic-bezier(.16,1,.3,1) forwards;
    }

    #blockOverlay.active .tag {
      animation: blockTag 1.35s 0.25s ease-out forwards;
    }

    /* Shared particles */
    .particles {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: calc(var(--size) * 0.5);
      border-radius: 4px;
      opacity: 0;
      transform-origin: center;
    }

    #threeOverlay .particle,
    #dunkOverlay .particle {
      background: linear-gradient(90deg, #fff4a7, var(--orange));
      box-shadow: 0 0 16px rgba(255,122,0,0.9);
    }

    #blockOverlay .particle {
      background: linear-gradient(90deg, #effbff, var(--blue));
      box-shadow: 0 0 16px rgba(89,168,255,0.9);
    }

    .overlay.active .particle {
      animation: particleFly 1.15s var(--delay) cubic-bezier(.1,.7,.2,1) forwards;
    }

    /* Keyframes */
    @keyframes particleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
      }
      72% { opacity: 1; }
      100% {
        opacity: 0;
        transform:
          translate(calc(-50% + var(--x)), calc(-50% + var(--y)))
          scale(1.5)
          rotate(var(--rot));
      }
    }

    @keyframes flash {
      0% { opacity: 0; transform: scale(0.25); }
      12% { opacity: 1; }
      60% { opacity: 0.65; }
      100% { opacity: 0; transform: scale(1.45); }
    }

    @keyframes ring {
      0% { opacity: 0.9; transform: scale(0.1); }
      100% { opacity: 0; transform: scale(7); }
    }

    @keyframes numberIn {
      0% { opacity: 0; transform: scale(4) rotate(-10deg); }
      28% { opacity: 1; transform: scale(0.86) rotate(3deg); }
      43% { transform: scale(1.08) rotate(-1deg); }
      72% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.38) translateY(-16px); }
    }

    @keyframes wordIn {
      0% { opacity: 0; transform: translateX(-110vw) skewX(-16deg); }
      30% { opacity: 1; transform: translateX(24px) skewX(-8deg); }
      44% { transform: translateX(0) skewX(-8deg); }
      76% { opacity: 1; transform: translateX(0) skewX(-8deg); }
      100% { opacity: 0; transform: translateX(105vw) skewX(-8deg); }
    }

    @keyframes subtitleIn {
      0% { opacity: 0; transform: translateY(35px) scale(0.9); }
      28%, 74% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(24px) scale(0.96); }
    }

    @keyframes dunkFlash {
      0% { opacity: 0; transform: scale(0.2); }
      16% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.35); }
    }

    @keyframes rimPop {
      0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
      28% { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) scale(1.08); }
    }

    @keyframes ballSlam {
      0% { opacity: 0; transform: translate(-50%, -120px) scale(0.7); }
      16% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      44% { opacity: 1; transform: translate(-50%, 180px) scale(1.06); }
      60% { opacity: 1; transform: translate(-50%, 100px) scale(0.92); }
      100% { opacity: 0; transform: translate(-50%, 260px) scale(0.8); }
    }

    @keyframes impactRing {
      0% { opacity: 0.95; transform: translate(-50%, -50%) scale(0.2); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(4.2); }
    }

    @keyframes crackLine {
      0% { opacity: 0; transform: translate(-50%, -50%) scaleX(0.15); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scaleX(1.2); }
    }

    @keyframes dunkBig {
      0% { opacity: 0; transform: scale(3.4) rotate(-8deg); }
      28% { opacity: 1; transform: scale(0.88) rotate(2deg); }
      45% { transform: scale(1.05) rotate(-1deg); }
      74% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.3) translateY(-16px); }
    }

    @keyframes dunkLabel {
      0% { opacity: 0; transform: translateY(180px) skewX(-16deg); }
      32% { opacity: 1; transform: translateY(0) skewX(-8deg); }
      76% { opacity: 1; transform: translateY(0) skewX(-8deg); }
      100% { opacity: 0; transform: translateY(-40px) skewX(-8deg); }
    }

    @keyframes dunkTag {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      24%, 74% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(20px) scale(0.96); }
    }

    @keyframes blockFlash {
      0% { opacity: 0; transform: scale(0.3); }
      16% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.28); }
    }

    @keyframes shieldPulse {
      0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.15); }
      24% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(2.8); }
    }

    @keyframes wallSwipe {
      0% { opacity: 0; transform: translateY(-50%) translateX(0) skewX(-22deg); }
      14% { opacity: 1; }
      54% { opacity: 1; transform: translateY(-50%) translateX(92vw) skewX(-22deg); }
      100% { opacity: 0; transform: translateY(-50%) translateX(104vw) skewX(-22deg); }
    }

    @keyframes rejectBall {
      0% { opacity: 0; transform: translate(0, 0) scale(0.85); }
      16% { opacity: 1; transform: translate(0, 0) scale(1); }
      38% { opacity: 1; transform: translate(-20px, 10px) scale(1.06); }
      68% { opacity: 1; transform: translate(180px, -120px) scale(0.92) rotate(26deg); }
      100% { opacity: 0; transform: translate(290px, -200px) scale(0.78) rotate(42deg); }
    }

    @keyframes blockBig {
      0% { opacity: 0; transform: scale(0.2); }
      22% { opacity: 1; transform: scale(1.14); }
      40% { transform: scale(0.96); }
      76% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.18) translateX(18px); }
    }

    @keyframes blockLabel {
      0% { opacity: 0; transform: translateX(110vw) skewX(-16deg); }
      32% { opacity: 1; transform: translateX(0) skewX(-8deg); }
      76% { opacity: 1; transform: translateX(0) skewX(-8deg); }
      100% { opacity: 0; transform: translateX(-90vw) skewX(-8deg); }
    }

    @keyframes blockTag {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      24%, 74% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(20px) scale(0.96); }
    }


    
    /* =========================
       TIRO LIBERO — elegante e discreto
    ========================= */
    #freeThrowOverlay {
      background: transparent;
    }

    #freeThrowOverlay .free-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(420px, 68vw);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      opacity: 0;
      background:
        radial-gradient(circle,
          rgba(255, 232, 170, 0.14) 0%,
          rgba(255, 165, 52, 0.06) 38%,
          transparent 72%);
      filter: blur(2px);
    }

    #freeThrowOverlay.active .free-glow {
      animation: freeGlow 1.18s ease-out forwards;
    }

    .free-effect {
      position: relative;
      z-index: 4;
      width: 320px;
      height: 270px;
      transform: translateY(-6px);
    }

    .free-arc {
      position: absolute;
      inset: 0;
      overflow: visible;
      opacity: 0;
    }

    .free-arc path {
      fill: none;
      stroke: rgba(255, 224, 163, 0.72);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 320;
      stroke-dashoffset: 320;
      filter: drop-shadow(0 0 8px rgba(255, 176, 69, 0.32));
    }

    #freeThrowOverlay.active .free-arc {
      animation: freeArcFade 1.32s ease-out forwards;
    }

    #freeThrowOverlay.active .free-arc path {
      animation: drawArc 0.7s 0.02s ease-out forwards;
    }

    .free-hoop {
      position: absolute;
      left: 182px;
      top: 122px;
      width: 122px;
      height: 26px;
      border: 4px solid rgba(255, 174, 72, 0.96);
      border-radius: 50%;
      opacity: 0;
      box-shadow:
        0 0 12px rgba(255, 174, 72, 0.42),
        inset 0 0 8px rgba(255, 215, 140, 0.18);
    }

    #freeThrowOverlay.active .free-hoop {
      animation: freeHoop 1.28s ease-out forwards;
    }

    .free-net {
      position: absolute;
      left: 190px;
      top: 145px;
      width: 106px;
      height: 74px;
      opacity: 0;
    }

    .free-net span {
      position: absolute;
      top: 0;
      width: 2px;
      height: 64px;
      border-radius: 999px;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.86),
        rgba(255,255,255,0.1)
      );
      transform-origin: top;
    }

    .free-net span:nth-child(1) { left: 6px; transform: rotate(-16deg); }
    .free-net span:nth-child(2) { left: 26px; transform: rotate(-9deg); }
    .free-net span:nth-child(3) { left: 46px; transform: rotate(-3deg); }
    .free-net span:nth-child(4) { right: 46px; transform: rotate(3deg); }
    .free-net span:nth-child(5) { right: 26px; transform: rotate(9deg); }
    .free-net span:nth-child(6) { right: 6px; transform: rotate(16deg); }

    #freeThrowOverlay.active .free-net {
      animation: freeNet 1.06s 0.22s ease-out forwards;
    }

    .free-ball {
      position: absolute;
      left: 0;
      top: 0;
      width: 38px;
      height: 38px;
      opacity: 0;
      offset-path: path("M 34 174 C 88 62, 174 34, 238 118 C 247 132, 244 165, 243 230");
      offset-anchor: 50% 50%;
      offset-rotate: auto 18deg;
      will-change: offset-distance, opacity, transform;
      transform: translateZ(0);
    }

    .free-ball-core {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 30% 27%, #ffd092 0%, #ff9a31 30%, #ef7205 68%, #a94000 100%);
      box-shadow:
        0 0 16px rgba(255, 135, 25, 0.5),
        inset -5px -6px 8px rgba(100, 30, 0, 0.22);
      transform-origin: center;
      will-change: transform;
    }

    .free-ball-core::before,
    .free-ball-core::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .free-ball-core::before {
      border-top: 2px solid rgba(75, 24, 0, 0.62);
      border-bottom: 2px solid rgba(75, 24, 0, 0.62);
      transform: rotate(18deg) scaleX(0.9);
    }

    .free-ball-core::after {
      left: 11px;
      right: 11px;
      border-left: 2px solid rgba(75, 24, 0, 0.62);
      border-right: 2px solid rgba(75, 24, 0, 0.62);
      border-radius: 50%;
      transform: rotate(-12deg);
    }

    #freeThrowOverlay.active .free-ball {
      animation: freeBall 1.28s cubic-bezier(.22,.68,.24,1) forwards;
    }

    #freeThrowOverlay.active .free-ball-core {
      animation: freeBallSpin 0.42s linear infinite;
    }

    .free-ripple {
      position: absolute;
      left: 243px;
      top: 134px;
      width: 110px;
      height: 34px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(255, 219, 150, 0.62);
      border-radius: 50%;
      opacity: 0;
    }

    #freeThrowOverlay.active .free-ripple {
      animation: freeRipple 0.76s 0.62s ease-out forwards;
    }

    .free-shine {
      position: absolute;
      width: 22px;
      height: 4px;
      border-radius: 999px;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
      filter: blur(0.4px);
    }

    .free-shine.left {
      left: 166px;
      top: 131px;
      transform: rotate(-34deg);
    }

    .free-shine.right {
      left: 292px;
      top: 131px;
      transform: rotate(34deg);
    }

    #freeThrowOverlay.active .free-shine {
      animation: freeShine 0.42s 0.58s ease-out forwards;
    }

    .free-sparks {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(85px, 4px);
      z-index: 5;
    }

    .free-spark {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      opacity: 0;
      background: rgba(255, 232, 182, 0.96);
      box-shadow: 0 0 7px rgba(255, 166, 60, 0.64);
    }

    #freeThrowOverlay.active .free-spark {
      animation: freeSpark 0.62s var(--delay) ease-out forwards;
    }

    @keyframes freeGlow {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.76); }
      28% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes freeArcFade {
      0% { opacity: 0; }
      10% { opacity: 1; }
      55% { opacity: 0.75; }
      100% { opacity: 0; }
    }

    @keyframes drawArc {
      from { stroke-dashoffset: 320; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes freeHoop {
      0% { opacity: 0; transform: scale(0.86); }
      24% { opacity: 1; transform: scale(1.03); }
      58% { opacity: 0.92; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.01); }
    }

    @keyframes freeNet {
      0% {
        opacity: 0;
        transform: scaleY(0.55);
      }
      30% {
        opacity: 0.84;
        transform: scaleY(1.12);
      }
      66% {
        opacity: 0.62;
        transform: translateY(12px) scaleY(0.84);
      }
      100% {
        opacity: 0;
        transform: translateY(20px) scaleY(0.72);
      }
    }

    @keyframes freeBall {
      0% {
        opacity: 0;
        offset-distance: 0%;
        transform: scale(0.78) translateZ(0);
      }
      8% {
        opacity: 1;
        transform: scale(0.92) translateZ(0);
      }
      46% {
        opacity: 1;
        transform: scale(1) translateZ(0);
      }
      70% {
        opacity: 1;
        transform: scale(1.03) translateZ(0);
      }
      86% {
        opacity: 1;
        transform: scale(0.96) translateZ(0);
      }
      100% {
        opacity: 0;
        offset-distance: 100%;
        transform: scale(0.72) translateZ(0);
      }
    }

    @keyframes freeRipple {
      0% {
        opacity: 0.76;
        transform: translate(-50%, -50%) scale(0.72);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.68);
      }
    }

    @keyframes freeBallSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes freeShine {
      0% { opacity: 0; transform: scaleX(0.4) rotate(var(--rot, 0deg)); }
      35% { opacity: 1; transform: scaleX(1.1) rotate(var(--rot, 0deg)); }
      100% { opacity: 0; transform: scaleX(1.4) rotate(var(--rot, 0deg)); }
    }

    @keyframes freeSpark {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0);
      }
      24% { opacity: 0.85; }
      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(0.85);
      }
    }

    .stage.shake {
      animation: stageShake 520ms ease-in-out;
    }

    @keyframes stageShake {
      0%, 100% { transform: translate(0,0); }
      15% { transform: translate(-8px, 5px); }
      30% { transform: translate(7px, -4px); }
      45% { transform: translate(-6px, 3px); }
      60% { transform: translate(5px, -2px); }
      75% { transform: translate(-3px, 2px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="hint">Demo animazioni · three, slam dunk, blocked e tiro libero</div>

  <section class="stage" id="stage">
    <h1 class="title">Animazioni Basket</h1>
    <div class="sub">Quattro effetti nello stesso file, incluso un tiro libero più discreto.</div>

    <div class="controls">
      <button class="three-btn" id="threeBtn">🏀 Tripla</button>
      <button class="dunk-btn" id="dunkBtn">💥 Schiacciata</button>
      <button class="block-btn" id="blockBtn">🖐️ Stoppata</button>
      <button class="free-btn" id="freeThrowBtn">◎ Tiro libero</button>
      <button class="neutral-btn" id="autoBtn">Auto demo</button>
    </div>
  </section>

  <!-- TRIPLA -->
  <section class="overlay" id="threeOverlay" aria-hidden="true">
    <div class="flash"></div>
    <div class="rings"></div>
    <div class="particles" id="threeParticles"></div>

    <div class="card">
      <div class="big">+3</div>
      <div class="label">THREE!</div>
      <div class="tag">From downtown</div>
    </div>
  </section>

  <!-- SCHIACCIATA -->
  <section class="overlay" id="dunkOverlay" aria-hidden="true">
    <div class="flash"></div>
    <div class="rim"></div>
    <div class="ball"></div>
    <div class="impact-ring"></div>
    <div class="crack"></div>
    <div class="particles" id="dunkParticles"></div>

    <div class="card">
      <div class="big">BOOM!</div>
      <div class="label">SLAM DUNK!</div>
      <div class="tag">Il ferro trema</div>
    </div>
  </section>

  <!-- STOPPATA -->
  <section class="overlay" id="blockOverlay" aria-hidden="true">
    <div class="blue-flash"></div>
    <div class="shield"></div>
    <div class="wall"></div>
    <div class="reject-ball"></div>
    <div class="particles" id="blockParticles"></div>

    <div class="card">
      <div class="big">NOPE!</div>
      <div class="label">BLOCKED!</div>
      <div class="tag">Non si passa da qui</div>
    </div>
  </section>


  
  <!-- TIRO LIBERO: effetto discreto e senza testo -->
  <section class="overlay" id="freeThrowOverlay" aria-hidden="true">
    <div class="free-glow"></div>
    <div class="free-sparks" id="freeSparks"></div>

    <div class="free-effect">
      <svg class="free-arc" viewBox="0 0 320 270" aria-hidden="true">
        <path d="M 34 174 C 88 62 174 34 238 118" />
      </svg>

      <div class="free-ball"><span class="free-ball-core"></span></div>
      <div class="free-hoop"></div>

      <div class="free-net">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="free-ripple"></div>
      <div class="free-shine left"></div>
      <div class="free-shine right"></div>
    </div>
  </section>


  <script>
    const stage = document.getElementById("stage");
    const threeBtn = document.getElementById("threeBtn");
    const dunkBtn = document.getElementById("dunkBtn");
    const blockBtn = document.getElementById("blockBtn");
    const freeThrowBtn = document.getElementById("freeThrowBtn");
    const autoBtn = document.getElementById("autoBtn");

    const threeOverlay = document.getElementById("threeOverlay");
    const dunkOverlay = document.getElementById("dunkOverlay");
    const blockOverlay = document.getElementById("blockOverlay");
    const freeThrowOverlay = document.getElementById("freeThrowOverlay");

    const threeParticles = document.getElementById("threeParticles");
    const dunkParticles = document.getElementById("dunkParticles");
    const blockParticles = document.getElementById("blockParticles");
    const freeSparks = document.getElementById("freeSparks");

    let autoTimer = null;
    let timers = [];

    function clearAllTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function stopAll() {
      clearAllTimers();
      [threeOverlay, dunkOverlay, blockOverlay, freeThrowOverlay].forEach(overlay => {
        overlay.classList.remove("active");
        overlay.setAttribute("aria-hidden", "true");
      });
      stage.classList.remove("shake");
    }

    function createParticles(container, theme = "warm") {
      container.innerHTML = "";
      const total = 24;

      for (let i = 0; i < total; i++) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * i) / total + Math.random() * 0.24;
        const distance = 150 + Math.random() * 320;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        const size = 8 + Math.random() * 16;
        const rotation = 260 + Math.random() * 720;
        const delay = Math.random() * 0.12;

        particle.className = "particle";
        particle.style.setProperty("--x", `${x}px`);
        particle.style.setProperty("--y", `${y}px`);
        particle.style.setProperty("--size", `${size}px`);
        particle.style.setProperty("--rot", `${rotation}deg`);
        particle.style.setProperty("--delay", `${delay}s`);

        container.appendChild(particle);
      }
    }


    
    function createFreeSparks() {
      freeSparks.innerHTML = "";
      const total = 10;

      for (let i = 0; i < total; i++) {
        const spark = document.createElement("span");
        const x = -28 + Math.random() * 56;
        const y = 8 + Math.random() * 34;
        const size = 2.4 + Math.random() * 3.2;
        const delay = 0.58 + Math.random() * 0.08;

        spark.className = "free-spark";
        spark.style.setProperty("--x", `${x}px`);
        spark.style.setProperty("--y", `${y}px`);
        spark.style.setProperty("--size", `${size}px`);
        spark.style.setProperty("--delay", `${delay}s`);

        freeSparks.appendChild(spark);
      }
    }


    function playThree() {
      stopAll();
      createParticles(threeParticles, "warm");
      void threeOverlay.offsetWidth;
      threeOverlay.classList.add("active");
      threeOverlay.setAttribute("aria-hidden", "false");

      timers.push(setTimeout(() => {
        threeOverlay.classList.remove("active");
        threeOverlay.setAttribute("aria-hidden", "true");
      }, 1900));
    }

    function playDunk() {
      stopAll();
      createParticles(dunkParticles, "warm");
      void dunkOverlay.offsetWidth;
      void stage.offsetWidth;

      dunkOverlay.classList.add("active");
      dunkOverlay.setAttribute("aria-hidden", "false");
      stage.classList.add("shake");

      timers.push(setTimeout(() => stage.classList.remove("shake"), 560));
      timers.push(setTimeout(() => {
        dunkOverlay.classList.remove("active");
        dunkOverlay.setAttribute("aria-hidden", "true");
      }, 1700));
    }

    function playBlock() {
      stopAll();
      createParticles(blockParticles, "cool");
      void blockOverlay.offsetWidth;

      blockOverlay.classList.add("active");
      blockOverlay.setAttribute("aria-hidden", "false");

      timers.push(setTimeout(() => {
        blockOverlay.classList.remove("active");
        blockOverlay.setAttribute("aria-hidden", "true");
      }, 1650));
    }


    
    function playFreeThrow() {
      stopAll();
      createFreeSparks();
      void freeThrowOverlay.offsetWidth;

      freeThrowOverlay.classList.add("active");
      freeThrowOverlay.setAttribute("aria-hidden", "false");

      timers.push(setTimeout(() => {
        freeThrowOverlay.classList.remove("active");
        freeThrowOverlay.setAttribute("aria-hidden", "true");
      }, 1500));
    }


    threeBtn.addEventListener("click", playThree);
    dunkBtn.addEventListener("click", playDunk);
    blockBtn.addEventListener("click", playBlock);
    freeThrowBtn.addEventListener("click", playFreeThrow);

    autoBtn.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoBtn.textContent = "Auto demo";
        return;
      }

      let turn = 0;
      const sequence = () => {
        const steps = [playThree, playDunk, playBlock, playFreeThrow];
        steps[turn % steps.length]();
        turn++;
      };

      sequence();
      autoTimer = setInterval(sequence, 2600);
      autoBtn.textContent = "Stop auto";
    });

    createParticles(threeParticles, "warm");
    createParticles(dunkParticles, "warm");
    createParticles(blockParticles, "cool");
    createFreeSparks();
  </script>
</body>
</html>
