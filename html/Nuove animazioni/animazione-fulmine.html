<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animazione Fulmine — Fulminato</title>
<style>
  :root{
    --ink:#0d0c0b; --bone:#fffefd; --orange:#ea6324;
    --bolt:#cfe6ff;                   /* colore scintille (elettrico) */
    --mono:Consolas,monospace;
    --display:"Arial Narrow","Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--display)}

  .stage{position:fixed;inset:0;display:grid;place-items:center;isolation:isolate;background:rgba(13,12,11,.86);overflow:hidden}
  .stage::before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at center,color-mix(in srgb,var(--orange) 34%,transparent),transparent 60%);opacity:.4;z-index:0}
  /* bagliore del lampo a tutto schermo */
  .flash{position:absolute;inset:0;z-index:2;background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.95),rgba(150,195,255,.45) 26%,transparent 62%);opacity:0;animation:strike-flash 2.8s ease-out forwards}

  .scene{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%}

  /* saetta (GIF reale, sfondo nero rimosso con fusione screen) */
  .bolt-gif{position:absolute;top:-3vh;left:50%;transform:translateX(-50%);height:min(98vh,72vw);width:auto;z-index:3;mix-blend-mode:screen;filter:drop-shadow(0 0 20px #4aa3ff) drop-shadow(0 0 44px rgba(90,150,255,.55));opacity:0;animation:gif-in 2.8s ease-out forwards;pointer-events:none}

  .sparks{position:absolute;left:50%;top:46%;z-index:4}
  .spark{position:absolute;width:var(--s);height:var(--s);background:var(--bolt);box-shadow:0 0 12px var(--orange);opacity:0;animation:spark .9s var(--d) cubic-bezier(.15,.7,.25,1) forwards}

  .msg{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;text-align:center;text-transform:uppercase;padding:0 4vw}
  .word{color:var(--bone);font-weight:1000;font-style:italic;font-size:clamp(64px,min(23vh,12vw),360px);line-height:.82;letter-spacing:-.01em;-webkit-text-stroke:clamp(3px,.9vh,9px) var(--orange);text-shadow:0 0 8px #fff,0 0 34px var(--orange),8px 10px 0 rgba(0,0,0,.45);opacity:0;animation:zap-in 2.8s cubic-bezier(.16,1,.3,1) forwards}
  .sub{margin-top:clamp(8px,2vh,22px);color:var(--orange);font-family:var(--mono);font-weight:900;font-size:clamp(20px,4.4vh,52px);letter-spacing:.36em;padding-left:.36em;opacity:0;animation:sub-in 2.8s ease-out forwards}

  .hint{position:fixed;right:22px;bottom:16px;color:#9ca3af;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase;z-index:9}

  /* ---- keyframes ---- */
  @keyframes strike-flash{0%{opacity:0}2%{opacity:.9}5%{opacity:.08}8%{opacity:.8}11%{opacity:0}15%{opacity:.5}18%{opacity:0}100%{opacity:0}}
  @keyframes gif-in{0%{opacity:0}4%{opacity:1}8%{opacity:.45}12%{opacity:1}18%{opacity:.7}24%{opacity:1}70%{opacity:1}100%{opacity:0}}
  @keyframes spark{0%{opacity:0;transform:translate(-50%,-50%) scale(0)}12%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2) rotate(var(--r))}}
  @keyframes zap-in{
    0%{opacity:0;transform:scale(2.4) skewX(-8deg);filter:blur(7px)}
    6%{opacity:1;filter:blur(0)}
    8%{transform:scale(.92) translate(7px,-5px) skewX(-8deg)}
    11%{transform:scale(1.07) translate(-7px,5px) skewX(-8deg)}
    14%{transform:scale(.98) translate(5px,2px) skewX(-8deg)}
    17%{transform:scale(1) translate(0,0) skewX(-8deg)}
    82%{opacity:1;transform:scale(1) skewX(-8deg)}
    100%{opacity:0;transform:scale(1.05) translateY(-16px) skewX(-8deg)}
  }
  @keyframes sub-in{0%{opacity:0;transform:translateY(24px)}22%{opacity:1;transform:translateY(0)}82%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(16px)}}

  @media (prefers-reduced-motion:reduce){
    .flash,.spark{animation:none;opacity:0}
    .bolt-gif{animation:none;opacity:.95}.word,.sub{animation:none;opacity:1}
  }
</style>
</head>

  <script>
    function sparks(){
      const c=document.getElementById('sparks'); c.replaceChildren();
      for(let i=0;i<28;i++){
        const s=document.createElement('span');
        const a=(Math.PI*2*i)/28 + (Math.random()*0.3);
        const d=140+Math.random()*380;
        s.className='spark';
        s.style.setProperty('--x',Math.cos(a)*d+'px');
        s.style.setProperty('--y',Math.sin(a)*d*0.7+80+'px');   /* leggero bias verso il basso */
        s.style.setProperty('--s',6+Math.random()*14+'px');
        s.style.setProperty('--r',300+Math.random()*720+'deg');
        s.style.setProperty('--d',0.1+Math.random()*0.12+'s');
        c.appendChild(s);
      }
    }
    function restartGif(){
      const g=document.getElementById('boltGif');
      const src=g.getAttribute('src');
      g.setAttribute('src','');            /* forza il reset della GIF */
      void g.offsetWidth;
      g.setAttribute('src',src);
    }
    function replay(){sparks();restartGif();document.querySelectorAll('.stage *').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation='';});}
    sparks();
    addEventListener('click',replay);
    addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();replay();}});
  </script>
