<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animazione Tiro Libero</title>
  <style>
    :root { --ink:#0d0c0b; --bone:#fffefd; --orange:#ea6324; --action-color:#2875bb; --mono:Consolas,monospace; --display:"Arial Narrow","Segoe UI",Arial,sans-serif; }
    *{box-sizing:border-box;margin:0;padding:0} html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--bone);font-family:var(--display)}
    .overlay{position:fixed;inset:0;display:grid;grid-template-columns:minmax(330px,.8fr) minmax(420px,1fr);align-items:center;gap:clamp(20px,5vw,80px);padding:6vw;background:rgba(13,12,11,.92);overflow:hidden}
    .glow{position:absolute;inset:0;background:radial-gradient(circle,color-mix(in srgb,var(--action-color) 38%,transparent),transparent 68%);opacity:0;animation:glow 1.65s ease-out forwards}
    .scene{position:relative;z-index:3;width:min(460px,42vw);height:330px;justify-self:center}
    .arc{position:absolute;inset:0;overflow:visible;opacity:0;animation:free-arc 1.5s ease-out forwards}.arc path{fill:none;stroke:color-mix(in srgb,var(--action-color) 70%,white);stroke-width:4;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;filter:drop-shadow(0 0 8px var(--action-color));animation:free-arc-draw .72s ease-out forwards}
    .ball{position:absolute;z-index:3;width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#ffd092,#f06c00 64%,#a94000);box-shadow:0 0 24px rgba(255,122,0,.6);opacity:0}.free-ball{left:0;top:0;width:44px;height:44px;offset-path:path("M 38 205 C 118 48 258 34 330 145 C 340 165 336 205 334 260");offset-anchor:50% 50%;animation:free-ball 1.35s cubic-bezier(.22,.68,.24,1) forwards}
    .rim{position:absolute;left:270px;top:147px;width:132px;height:28px;border:5px solid var(--action-color);border-radius:50%;opacity:0;box-shadow:0 0 14px var(--action-color);animation:free-rim 1.4s ease-out forwards}
    .net{position:absolute;left:282px;top:173px;width:110px;height:80px;opacity:0;animation:free-net 1.15s .25s ease-out forwards}.net i{position:absolute;top:0;width:2px;height:70px;background:linear-gradient(var(--bone),transparent);transform-origin:top}.net i:nth-child(1){left:4px;transform:rotate(-16deg)}.net i:nth-child(2){left:24px;transform:rotate(-9deg)}.net i:nth-child(3){left:45px;transform:rotate(-3deg)}.net i:nth-child(4){right:45px;transform:rotate(3deg)}.net i:nth-child(5){right:24px;transform:rotate(9deg)}.net i:nth-child(6){right:4px;transform:rotate(16deg)}
    .ripple{position:absolute;left:336px;top:159px;width:120px;height:36px;transform:translate(-50%,-50%);border:3px solid color-mix(in srgb,var(--action-color) 65%,white);border-radius:50%;opacity:0;animation:free-ripple .78s .64s ease-out forwards}
    .caption{position:relative;z-index:4;text-transform:uppercase}.team{display:block;color:var(--action-color);font-family:var(--mono);font-size:clamp(14px,2vh,24px);font-weight:900;letter-spacing:.25em}.label{display:block;margin-top:10px;color:var(--orange);font-family:var(--mono);font-size:clamp(18px,2.8vh,34px);font-weight:900;letter-spacing:.28em}.big{display:block;margin:14px 0;color:var(--bone);font-size:clamp(72px,12vh,150px);font-style:italic;font-weight:1000;line-height:.82;text-transform:uppercase;text-shadow:6px 6px 0 rgba(0,0,0,.38),0 0 28px var(--action-color)}.player{display:inline-block;margin-top:26px;padding:10px 26px;border:2px solid var(--action-color);background:var(--ink);color:var(--bone);font-family:var(--mono);font-size:clamp(20px,3vh,38px);font-weight:900;letter-spacing:.1em;text-transform:uppercase}.caption>*{opacity:0;animation:caption 1.5s .2s ease-out forwards}
    .hint{position:fixed;right:22px;bottom:18px;color:#9ca3af;font-family:var(--mono);font-size:14px;letter-spacing:.08em;text-transform:uppercase}
    @keyframes glow{0%{opacity:0;transform:scale(.6)}20%{opacity:1}100%{opacity:0;transform:scale(1.35)}}@keyframes caption{0%{opacity:0;transform:translateY(30px)}28%,74%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(20px)}}@keyframes free-arc{0%{opacity:0}18%,82%{opacity:1}100%{opacity:0}}@keyframes free-arc-draw{to{stroke-dashoffset:0}}@keyframes free-ball{0%{opacity:0;offset-distance:0%;transform:scale(.65)}12%{opacity:1}76%{opacity:1;offset-distance:100%;transform:scale(1)}100%{opacity:0;offset-distance:100%;transform:scale(.45)}}@keyframes free-rim{0%{opacity:0;transform:scale(.7)}30%,76%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}@keyframes free-net{0%{opacity:0;transform:translateY(-12px)}36%,78%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(12px)}}@keyframes free-ripple{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}36%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45)}}
  </style>
</head>
<body>
  <main class="overlay" id="overlay"><div class="glow"></div><div class="scene"><svg class="arc" viewBox="0 0 420 300"><path d="M 38 205 C 118 48 258 34 330 145 C 340 165 336 205 334 260"/></svg><div class="ball free-ball"></div><div class="rim"></div><div class="net"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ripple"></div></div><section class="caption"><span class="team">Aurora Lynx</span><span class="label">+1</span><strong class="big">Tiro libero</strong><span class="player">#18 Foschi Dario</span></section></main>
  <div class="hint">Click / spazio per riavviare</div>
  <script>function replay(){document.querySelectorAll('*').forEach(e=>{e.style.animation='none';void e.offsetWidth;e.style.animation=''})}addEventListener('click',replay);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();replay()}})</script>
</body>
</html>
