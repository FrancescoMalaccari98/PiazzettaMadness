<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animazione Tripla - Solo Effetto</title>
  <style>
    :root {
      --orange: #ff7a00;
      --yellow: #ffd166;
      --bg1: #050608;
      --bg2: #13151b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
      background:
        radial-gradient(circle at 50% 35%, rgba(255, 122, 0, 0.16), transparent 30%),
        linear-gradient(135deg, var(--bg1), var(--bg2) 55%, #08090c);
    }

    .controls {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      appearance: none;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      color: #111;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, var(--yellow), var(--orange));
      box-shadow: 0 12px 30px rgba(255, 122, 0, 0.25);
      transition: transform 160ms ease, filter 160ms ease;
    }

    button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: brightness(1.06);
    }

    button.secondary {
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: none;
    }

    .hint {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      padding: 10px 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px;
      color: rgba(255,255,255,0.76);
      font-size: 14px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
    }

    .three-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      visibility: hidden;
      overflow: hidden;
      pointer-events: none;
    }

    .three-overlay.active {
      visibility: visible;
    }

    .flash {
      position: absolute;
      inset: -30%;
      opacity: 0;
      background:
        radial-gradient(circle at center,
          rgba(255, 244, 170, 0.98) 0%,
          rgba(255, 166, 0, 0.78) 18%,
          rgba(255, 85, 0, 0.28) 42%,
          transparent 68%);
    }

    .three-overlay.active .flash {
      animation: flash 1.65s ease-out forwards;
    }

    .rings {
      position: absolute;
      width: 160px;
      height: 160px;
      border: 5px solid var(--yellow);
      border-radius: 50%;
      opacity: 0;
      box-shadow:
        0 0 24px var(--orange),
        inset 0 0 24px var(--orange);
    }

    .three-overlay.active .rings {
      animation: ring 1.3s ease-out forwards;
    }

    .three-card {
      position: relative;
      z-index: 4;
      width: min(900px, 92vw);
      padding: 28px;
      text-align: center;
      transform: rotate(-2deg);
      filter: drop-shadow(0 18px 24px rgba(0, 0, 0, 0.65));
    }

    .plus-three {
      opacity: 0;
      color: white;
      font-size: clamp(88px, 18vw, 240px);
      font-weight: 1000;
      line-height: 0.76;
      letter-spacing: -0.1em;
      -webkit-text-stroke: 4px var(--orange);
      text-shadow:
        8px 8px 0 rgba(0, 0, 0, 0.28),
        0 0 36px rgba(255, 122, 0, 0.75);
    }

    .three-word {
      opacity: 0;
      margin-top: 18px;
      font-size: clamp(62px, 12vw, 166px);
      font-weight: 1000;
      font-style: italic;
      line-height: 0.82;
      letter-spacing: -0.06em;
      color: transparent;
      background: linear-gradient(180deg, #fff 0%, #ffe08a 35%, #ff7a00 95%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: 2px rgba(255, 255, 255, 0.65);
      text-shadow: 0 0 34px rgba(255, 122, 0, 0.55);
    }

    .player-line {
      display: inline-block;
      margin-top: 24px;
      padding: 10px 22px;
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      color: white;
      font-size: clamp(16px, 2.4vw, 28px);
      font-weight: 950;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(12px);
    }

    .three-overlay.active .plus-three {
      animation: numberIn 1.7s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .three-overlay.active .three-word {
      animation: wordIn 1.7s 80ms cubic-bezier(.16, 1, .3, 1) forwards;
    }

    .three-overlay.active .player-line {
      animation: subtitleIn 1.5s 260ms ease-out forwards;
    }

    .particles {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
    }

    .particle {
      position: absolute;
      width: var(--size);
      height: calc(var(--size) * 0.46);
      border-radius: 4px;
      opacity: 0;
      background: linear-gradient(90deg, #fff4a7, var(--orange));
      box-shadow: 0 0 16px rgba(255, 122, 0, 0.9);
      transform-origin: center;
    }

    .three-overlay.active .particle {
      animation: particleFly 1.2s var(--delay) cubic-bezier(.1, .7, .2, 1) forwards;
    }

    @keyframes flash {
      0% { opacity: 0; transform: scale(0.25); }
      12% { opacity: 1; }
      60% { opacity: 0.65; }
      100% { opacity: 0; transform: scale(1.45); }
    }

    @keyframes ring {
      0% { opacity: 0.9; transform: scale(0.1); }
      100% { opacity: 0; transform: scale(7); }
    }

    @keyframes numberIn {
      0% {
        opacity: 0;
        transform: scale(4) rotate(-10deg);
      }
      28% {
        opacity: 1;
        transform: scale(0.86) rotate(3deg);
      }
      43% {
        transform: scale(1.08) rotate(-1deg);
      }
      72% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 0;
        transform: scale(1.38) translateY(-16px);
      }
    }

    @keyframes wordIn {
      0% {
        opacity: 0;
        transform: translateX(-110vw) skewX(-16deg);
      }
      30% {
        opacity: 1;
        transform: translateX(24px) skewX(-8deg);
      }
      44% {
        transform: translateX(0) skewX(-8deg);
      }
      76% {
        opacity: 1;
        transform: translateX(0) skewX(-8deg);
      }
      100% {
        opacity: 0;
        transform: translateX(105vw) skewX(-8deg);
      }
    }

    @keyframes subtitleIn {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.9);
      }
      28%, 74% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
    }

    @keyframes particleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0) rotate(0deg);
      }
      72% { opacity: 1; }
      100% {
        opacity: 0;
        transform:
          translate(
            calc(-50% + var(--x)),
            calc(-50% + var(--y))
          )
          scale(1.5)
          rotate(var(--rot));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="hint">Demo solo animazione · premi il pulsante sotto</div>

  <div class="controls">
    <button id="playButton">🏀 Lancia animazione</button>
    <button id="autoButton" class="secondary">Auto play</button>
  </div>

  <section id="threeOverlay" class="three-overlay" aria-hidden="true">
    <div class="flash"></div>
    <div class="rings"></div>
    <div class="particles" id="particles"></div>

    <div class="three-card">
      <div class="plus-three">+3</div>
      <div class="three-word">TRIPLA!</div>
      <div class="player-line">Numero 7 · Lorenzo</div>
    </div>
  </section>

  <script>
    const overlay = document.getElementById("threeOverlay");
    const playButton = document.getElementById("playButton");
    const autoButton = document.getElementById("autoButton");
    const particles = document.getElementById("particles");

    let cleanupTimer;
    let autoTimer = null;

    function createParticles() {
      particles.innerHTML = "";
      const total = 26;

      for (let i = 0; i < total; i++) {
        const particle = document.createElement("span");
        const angle = (Math.PI * 2 * i) / total + Math.random() * 0.25;
        const distance = 180 + Math.random() * 360;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        const size = 8 + Math.random() * 18;
        const rotation = 300 + Math.random() * 720;
        const delay = Math.random() * 0.12;

        particle.className = "particle";
        particle.style.setProperty("--x", `${x}px`);
        particle.style.setProperty("--y", `${y}px`);
        particle.style.setProperty("--size", `${size}px`);
        particle.style.setProperty("--rot", `${rotation}deg`);
        particle.style.setProperty("--delay", `${delay}s`);

        particles.appendChild(particle);
      }
    }

    function playAnimation() {
      clearTimeout(cleanupTimer);

      overlay.classList.remove("active");
      createParticles();

      void overlay.offsetWidth;

      overlay.classList.add("active");
      overlay.setAttribute("aria-hidden", "false");

      cleanupTimer = setTimeout(() => {
        overlay.classList.remove("active");
        overlay.setAttribute("aria-hidden", "true");
      }, 1900);
    }

    playButton.addEventListener("click", playAnimation);

    autoButton.addEventListener("click", () => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        autoButton.textContent = "Auto play";
        return;
      }

      playAnimation();
      autoTimer = setInterval(playAnimation, 2600);
      autoButton.textContent = "Stop auto";
    });

    createParticles();
  </script>
</body>
</html>
